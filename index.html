<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>KimFoods 製造スケジュール</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
  --primary: #1a73e8;
  --primary-dark: #1557b0;
  --danger: #d93025;
  --bg: #f5f5f5;
  --card-bg: #fff;
  --text: #202124;
  --text-secondary: #5f6368;
  --border: #dadce0;
  --header-height: 56px;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 16px;
  overflow-x: hidden;
}

/* ヘッダー */
.header {
  position: fixed; top: 0; left: 0; right: 0;
  height: var(--header-height);
  background: var(--primary);
  color: #fff;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 12px;
  z-index: 100;
  box-shadow: 0 2px 4px rgba(0,0,0,.2);
}
.header h1 { font-size: 18px; font-weight: 600; }
.header-actions { display: flex; gap: 8px; }
.header-btn {
  background: rgba(255,255,255,.2);
  border: none; color: #fff; padding: 8px 12px;
  border-radius: 8px; font-size: 14px; cursor: pointer;
}
.header-btn:active { background: rgba(255,255,255,.35); }

/* メインコンテンツ */
.main { margin-top: var(--header-height); }

/* 日付ナビ */
.date-nav {
  position: sticky; top: var(--header-height);
  background: var(--card-bg);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  padding: 8px 4px;
  gap: 4px;
  z-index: 50;
}
.date-nav button {
  background: none; border: none; font-size: 24px;
  color: var(--primary); cursor: pointer;
  padding: 4px 8px; border-radius: 8px;
}
.date-nav button:active { background: #e8f0fe; }
.date-nav .date-label {
  font-size: 18px; font-weight: 600;
  min-width: 180px; text-align: center;
  cursor: pointer;
}
.date-nav .today-btn {
  font-size: 13px; background: var(--primary);
  color: #fff; padding: 6px 12px; border-radius: 16px;
  border: none; cursor: pointer;
}
.date-nav .today-btn:active { background: var(--primary-dark); }

/* スケジュールテーブル */
.schedule-container { padding: 8px; }

.category-section {
  background: var(--card-bg);
  border-radius: 12px;
  margin-bottom: 12px;
  box-shadow: 0 1px 3px rgba(0,0,0,.1);
  overflow: hidden;
}
.category-header {
  background: #e8f0fe;
  padding: 10px 14px;
  font-size: 16px; font-weight: 700;
  color: var(--primary-dark);
  display: flex; justify-content: space-between; align-items: center;
  cursor: pointer;
}
.category-header:active { background: #d2e3fc; }
.category-order-num { color: var(--danger); margin-right: 2px; }
.category-kg { font-size: 14px; font-weight: 600; color: var(--text-secondary); }

.product-row {
  display: flex; align-items: center;
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  min-height: 52px;
}
.product-row:last-child { border-bottom: none; }
.product-row:active { background: #f1f3f4; }
.product-name { flex: 1; font-size: 15px; }
.product-qty {
  font-size: 18px; font-weight: 700;
  color: var(--primary); min-width: 60px; text-align: right;
}
.product-qty.empty { color: #bbb; font-weight: 400; }
/* 楽観的更新：まだサーバーに確定していない値 */
.product-qty.pending, .category-order-num.pending { opacity: .45; }
.product-qty.pending::after {
  content: '●'; font-size: 8px; vertical-align: super;
  margin-left: 3px; color: var(--primary);
}
.product-kg {
  font-size: 13px; color: var(--text-secondary);
  min-width: 70px; text-align: right; margin-left: 8px;
}

/* 合計バー */
.total-bar {
  background: var(--primary);
  color: #fff;
  padding: 12px 16px;
  text-align: center;
  font-size: 18px; font-weight: 700;
  border-radius: 12px;
  margin-bottom: 12px;
}

/* モーダル */
.modal-overlay {
  display: none;
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,.5);
  z-index: 200;
  justify-content: center; align-items: flex-end;
}
.modal-overlay.active { display: flex; }
.modal {
  background: var(--card-bg);
  border-radius: 20px 20px 0 0;
  width: 100%; max-width: 500px;
  padding: 24px 20px;
  padding-bottom: max(24px, env(safe-area-inset-bottom));
  animation: slideUp .25s ease-out;
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

.modal-title {
  font-size: 18px; font-weight: 700;
  margin-bottom: 4px;
}
.modal-subtitle {
  font-size: 14px; color: var(--text-secondary);
  margin-bottom: 20px;
}
.modal-input-group { margin-bottom: 16px; }
.modal-input-group label {
  display: block; font-size: 14px; font-weight: 600;
  margin-bottom: 6px; color: var(--text-secondary);
}
.modal-input-group input {
  width: 100%; padding: 14px;
  border: 2px solid var(--border);
  border-radius: 12px; font-size: 22px;
  text-align: center; outline: none;
}
.modal-input-group input:focus { border-color: var(--primary); }
.modal-calc {
  text-align: center; font-size: 16px;
  color: var(--text-secondary); margin-bottom: 20px;
}
.modal-calc strong { color: var(--primary); font-size: 20px; }

.modal-actions { display: flex; gap: 10px; }
.modal-actions button {
  flex: 1; padding: 14px;
  border: none; border-radius: 12px;
  font-size: 16px; font-weight: 600; cursor: pointer;
}
.btn-cancel { background: #f1f3f4; color: var(--text); }
.btn-cancel:active { background: #e0e0e0; }
.btn-save { background: var(--primary); color: #fff; }
.btn-save:active { background: var(--primary-dark); }
.btn-delete { background: var(--danger); color: #fff; }
.btn-delete:active { background: #b71c1c; }

/* 設定画面 */
.settings-screen {
  display: none;
  margin-top: var(--header-height);
  padding: 12px;
}
.settings-screen.active { display: block; }
.settings-section {
  background: var(--card-bg);
  border-radius: 12px;
  margin-bottom: 16px;
  box-shadow: 0 1px 3px rgba(0,0,0,.1);
  overflow: hidden;
}
.settings-section-title {
  padding: 12px 14px;
  font-size: 16px; font-weight: 700;
  background: #e8f0fe; color: var(--primary-dark);
}
.settings-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
}
.settings-item:last-child { border-bottom: none; }
.settings-item:active { background: #f1f3f4; }
.settings-item-name { font-size: 15px; }
.settings-item-detail { font-size: 13px; color: var(--text-secondary); }
.add-btn {
  display: block; width: 100%; padding: 14px;
  background: var(--primary); color: #fff;
  border: none; border-radius: 12px;
  font-size: 16px; font-weight: 600;
  cursor: pointer; margin-bottom: 12px;
}
.add-btn:active { background: var(--primary-dark); }

/* 設定モーダル */
.settings-modal-overlay {
  display: none;
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,.5);
  z-index: 200;
  justify-content: center; align-items: center;
}
.settings-modal-overlay.active { display: flex; }
.settings-modal {
  background: var(--card-bg);
  border-radius: 16px;
  width: 90%; max-width: 420px;
  padding: 24px 20px;
  max-height: 80vh; overflow-y: auto;
}
.settings-modal h3 { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 4px; color: var(--text-secondary); }
.form-group input, .form-group select {
  width: 100%; padding: 12px;
  border: 2px solid var(--border); border-radius: 10px;
  font-size: 16px; outline: none;
}
.form-group input:focus, .form-group select:focus { border-color: var(--primary); }
.checkbox-group {
  display: flex; align-items: center; gap: 8px;
}
.checkbox-group input[type="checkbox"] {
  width: 22px; height: 22px;
}

/* トースト（LINE共有・保存結果の通知） */
.line-toast {
  display: none;
  position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
  background: #333; color: #fff;
  padding: 12px 24px; border-radius: 24px;
  font-size: 14px; z-index: 300;
  max-width: 88%; text-align: center; line-height: 1.5;
  white-space: pre-line; box-shadow: 0 2px 12px rgba(0,0,0,.3);
}
.line-toast.show { display: block; animation: fadeInOut 2s ease; }
.line-toast.show.long { animation: fadeInOut 5s ease; }
.line-toast.warn { background: #ef6c00; }
.line-toast.error { background: #c62828; }

/* 保存中インジケータ（画面は操作できたままにする） */
.sync-badge {
  display: none;
  position: fixed; top: 8px; left: 50%; transform: translateX(-50%);
  background: rgba(32,33,36,.88); color: #fff;
  padding: 5px 14px 5px 10px; border-radius: 20px;
  font-size: 12px; z-index: 400;
  align-items: center; gap: 6px;
}
.sync-badge.show { display: flex; }
.sync-badge::before {
  content: ''; width: 11px; height: 11px;
  border: 2px solid rgba(255,255,255,.35); border-top-color: #fff;
  border-radius: 50%; animation: spin .8s linear infinite;
}
@keyframes fadeInOut {
  0% { opacity: 0; } 10% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; }
}

/* ローディング */
.loading {
  display: none;
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(255,255,255,.8);
  z-index: 300;
  justify-content: center; align-items: center;
  font-size: 18px; color: var(--text-secondary);
}
.loading.active { display: flex; }
.spinner {
  width: 36px; height: 36px;
  border: 4px solid var(--border);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin .8s linear infinite;
  margin-right: 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- 保存中インジケータ -->
<div class="sync-badge" id="syncBadge">保存中…</div>

<!-- ヘッダー -->
<div class="header">
  <h1 id="headerTitle">製造スケジュール</h1>
  <div class="header-actions">
    <button class="header-btn" id="btnLine" onclick="copyForLine()">LINE共有</button>
    <button class="header-btn" id="btnSettings" onclick="toggleSettings()">設定</button>
  </div>
</div>

<!-- メイン（スケジュール画面） -->
<div class="main" id="scheduleScreen">
  <!-- 日付ナビ -->
  <div class="date-nav">
    <button onclick="changeDate(-1)">◀</button>
    <div class="date-label" id="dateLabel" onclick="openDatePicker()"></div>
    <button onclick="changeDate(1)">▶</button>
    <button class="today-btn" onclick="goToday()">今日</button>
  </div>
  <input type="date" id="datePicker" style="position:absolute;opacity:0;pointer-events:none;">

  <!-- スケジュール内容 -->
  <div class="schedule-container" id="scheduleContainer"></div>
</div>

<!-- 設定画面 -->
<div class="settings-screen" id="settingsScreen">
  <!-- カテゴリ管理 -->
  <div class="settings-section">
    <div class="settings-section-title">カテゴリ管理</div>
    <div id="categoryList"></div>
  </div>
  <button class="add-btn" onclick="openCategoryModal()">＋ カテゴリ追加</button>

  <!-- 商品管理 -->
  <div class="settings-section">
    <div class="settings-section-title">商品管理</div>
    <div id="productList"></div>
  </div>
  <button class="add-btn" onclick="openProductModal()">＋ 商品追加</button>
</div>

<!-- 数量入力モーダル -->
<div class="modal-overlay" id="qtyModal">
  <div class="modal">
    <div class="modal-title" id="qtyModalTitle"></div>
    <div class="modal-subtitle" id="qtyModalDate"></div>
    <div class="modal-input-group">
      <label>数量（個）</label>
      <input type="number" id="qtyInput" inputmode="numeric" pattern="[0-9]*" placeholder="0"
             oninput="updateCalc()">
    </div>
    <div class="modal-calc" id="qtyCalc"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeQtyModal()">キャンセル</button>
      <button class="btn-delete" id="btnQtyDelete" onclick="deleteQty()" style="display:none">削除</button>
      <button class="btn-save" onclick="saveQty()">保存</button>
    </div>
  </div>
</div>

<!-- カテゴリ編集モーダル -->
<div class="settings-modal-overlay" id="categoryModal">
  <div class="settings-modal">
    <h3 id="categoryModalTitle">カテゴリ追加</h3>
    <div class="form-group">
      <label>カテゴリ名</label>
      <input type="text" id="catName" placeholder="例: 中辛">
    </div>
    <div class="form-group">
      <label>表示順</label>
      <input type="number" id="catOrder" inputmode="numeric" value="0">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeCategoryModal()">キャンセル</button>
      <button class="btn-delete" id="btnCatDelete" onclick="deleteCategory()" style="display:none">削除</button>
      <button class="btn-save" onclick="saveCategory()">保存</button>
    </div>
  </div>
</div>

<!-- 商品編集モーダル -->
<div class="settings-modal-overlay" id="productModal">
  <div class="settings-modal">
    <h3 id="productModalTitle">商品追加</h3>
    <div class="form-group">
      <label>商品名</label>
      <input type="text" id="prodName" placeholder="例: 330g">
    </div>
    <div class="form-group">
      <label>カテゴリ</label>
      <select id="prodCategory"></select>
    </div>
    <div class="form-group">
      <label>内容量（g）</label>
      <input type="number" id="prodContentG" inputmode="decimal" value="0">
    </div>
    <div class="form-group">
      <label>係数</label>
      <input type="number" id="prodCoeff" inputmode="decimal" step="0.01" value="0.68">
    </div>
    <div class="form-group">
      <label>表示順</label>
      <input type="number" id="prodOrder" inputmode="numeric" value="0">
    </div>
    <div class="form-group">
      <div class="checkbox-group">
        <input type="checkbox" id="prodNoCalc">
        <label for="prodNoCalc" style="margin-bottom:0">原料計算しない</label>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeProductModal()">キャンセル</button>
      <button class="btn-delete" id="btnProdDelete" onclick="deleteProduct()" style="display:none">削除</button>
      <button class="btn-save" onclick="saveProduct()">保存</button>
    </div>
  </div>
</div>

<!-- カテゴリ作業順序モーダル -->
<div class="modal-overlay" id="catOrderModal">
  <div class="modal">
    <div class="modal-title" id="catOrderModalTitle"></div>
    <div class="modal-subtitle">作業順序番号を入力</div>
    <div class="modal-input-group">
      <label>順序番号</label>
      <input type="number" id="catOrderInput" inputmode="numeric" pattern="[0-9]*" placeholder="番号なし">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeCatOrderModal()">キャンセル</button>
      <button class="btn-delete" onclick="clearCatOrder()">クリア</button>
      <button class="btn-save" onclick="saveCatOrder()">保存</button>
    </div>
  </div>
</div>

<!-- LINE共有トースト -->
<div class="line-toast" id="lineToast">クリップボードにコピーしました</div>

<!-- ローディング -->
<div class="loading" id="loading">
  <div class="spinner"></div>
  読み込み中...
</div>

<script>
// ========================================
// GAS Web API URL（デプロイ後に設定）
// ========================================
var API_URL = 'https://script.google.com/macros/s/AKfycbzvzntecxYTsOOFEgyr5ZX8ikDXs7Zsx7JrpDlW42RUBW16yEuMVwsLvpg6pL15qlVLZg/exec';

// ========================================
// グローバル変数
// ========================================
var currentDate = new Date();
var products = [];
var categories = [];
var schedules = [];
var editingProductId = null;
var editingCategoryId = null;
var editingCatOrderId = null;
var categoryOrders = [];
var isSettingsOpen = false;

// ========================================
// 初期化
// ========================================
document.addEventListener('DOMContentLoaded', function() {
  setCurrentDate(new Date());
  loadData();
});

function setCurrentDate(date) {
  currentDate = new Date(date);
  currentDate.setHours(0, 0, 0, 0);
  updateDateLabel();
}

function updateDateLabel() {
  var y = currentDate.getFullYear();
  var m = currentDate.getMonth() + 1;
  var d = currentDate.getDate();
  var dayNames = ['日', '月', '火', '水', '木', '金', '土'];
  var dayName = dayNames[currentDate.getDay()];
  document.getElementById('dateLabel').textContent = y + '/' + m + '/' + d + '（' + dayName + '）';
}

function formatDate(date) {
  var y = date.getFullYear();
  var m = ('0' + (date.getMonth() + 1)).slice(-2);
  var d = ('0' + date.getDate()).slice(-2);
  return y + '-' + m + '-' + d;
}

// ========================================
// 日付操作
// ========================================
function changeDate(delta) {
  var d = new Date(currentDate);
  d.setDate(d.getDate() + delta);
  setCurrentDate(d);
  loadSchedules();
}

function goToday() {
  setCurrentDate(new Date());
  loadSchedules();
}

function openDatePicker() {
  var picker = document.getElementById('datePicker');
  picker.value = formatDate(currentDate);
  picker.style.pointerEvents = 'auto';
  picker.showPicker ? picker.showPicker() : picker.click();
  picker.onchange = function() {
    if (this.value) {
      setCurrentDate(new Date(this.value + 'T00:00:00'));
      loadSchedules();
    }
    this.style.pointerEvents = 'none';
  };
  picker.onblur = function() {
    this.style.pointerEvents = 'none';
  };
}

// ========================================
// API通信
// ========================================
function showLoading() { document.getElementById('loading').classList.add('active'); }
function hideLoading() { document.getElementById('loading').classList.remove('active'); }

// トースト表示（alertはページ全体をブロックしてしまうので使わない）
var toastTimer = null;
function showToast(msg, level) {
  var toast = document.getElementById('lineToast');
  toast.textContent = msg;
  toast.className = 'line-toast';
  if (level) toast.classList.add(level);
  if (level) toast.classList.add('long');
  void toast.offsetWidth;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function() {
    toast.classList.remove('show');
  }, level ? 5000 : 2000);
}

var API_TIMEOUT_MS = 30000;
var RECOVERED_MSG = '保存できています（応答が遅れたためシートで確認しました）';

// GASのレスポンスは 302 → script.googleusercontent.com の2段構え。
// 遅延やリダイレクト先の404でHTMLが返ることがあるので、
// text() で受けてから自分でJSONパースし、失敗の種類を区別できるようにする。
function apiRequest(url) {
  var controller = new AbortController();
  var timer = setTimeout(function() { controller.abort(); }, API_TIMEOUT_MS);

  return fetch(url, { signal: controller.signal })
    .then(function(r) {
      return r.text().then(function(text) { return { status: r.status, text: text }; });
    })
    .then(function(res) {
      if (res.status < 200 || res.status >= 300) {
        throw new Error('サーバー応答エラー (HTTP ' + res.status + ')');
      }
      var trimmed = res.text.replace(/^﻿/, '').trim();
      if (trimmed.charAt(0) !== '{' && trimmed.charAt(0) !== '[') {
        // Googleのエラーページ（HTML）が返ってきたケース
        throw new Error('サーバーからJSON以外の応答が返りました');
      }
      try {
        return JSON.parse(trimmed);
      } catch (err) {
        throw new Error('応答の解析に失敗しました');
      }
    })
    .catch(function(err) {
      if (err.name === 'AbortError') {
        throw new Error('応答がありません（' + (API_TIMEOUT_MS / 1000) + '秒でタイムアウト）');
      }
      throw err;
    })
    .then(function(result) {
      clearTimeout(timer);
      return result;
    }, function(err) {
      clearTimeout(timer);
      throw err;
    });
}

function buildGetUrl(action, params) {
  var url = API_URL + '?action=' + encodeURIComponent(action);
  if (params) {
    Object.keys(params).forEach(function(key) {
      url += '&' + encodeURIComponent(key) + '=' + encodeURIComponent(params[key]);
    });
  }
  return url;
}

// 読み取りは副作用がないので、失敗したら1回だけ黙って再試行する
function apiGet(action, params) {
  var url = buildGetUrl(action, params);
  return apiRequest(url).catch(function(err) {
    console.warn('apiGet retry:', action, err.message);
    return apiRequest(url);
  }).catch(function(err) {
    console.error('apiGet error:', action, err);
    throw err;
  });
}

// 書き込み。
// GASは「①シートに書き込む → ②302でリダイレクトして結果を返す」という順番なので、
// ②が失敗しても①は完了している。つまり通信エラー = 保存失敗ではない。
// そこで失敗時は決めつけずにシートを読み直し、反映されていれば成功として扱う。
// 書き込み自体の再試行はしない（商品・カテゴリの新規追加が二重登録になるため）。
function apiWrite(data, verify) {
  var url = API_URL + '?data=' + encodeURIComponent(JSON.stringify(data));

  return apiRequest(url).then(function(result) {
    if (!result || result.success !== true) {
      throw new Error((result && result.error) || '保存できませんでした');
    }
    return result;
  }).catch(function(err) {
    console.warn('apiWrite failed, verifying:', data.action, err.message);
    if (!verify) throw err;

    // 応答を取りこぼしただけかどうかをシートを見て確かめる
    return verify().then(function(saved) {
      if (saved) {
        console.log('apiWrite: 応答は取りこぼしたが保存は完了していた', data.action);
        return { success: true, recovered: true };
      }
      throw err;
    }, function() {
      // 確認そのものができなかった場合は元のエラーを返す
      throw err;
    });
  });
}

// --- 旧GAS互換 ---
// getAll / getDay は新しいCode.gsで追加したアクション。
// GASを再デプロイする前にGitHub Pagesだけ更新しても壊れないよう、
// 未対応と分かったら従来の個別アクションにフォールバックする。
function isUnknownAction(result) {
  return !!result && result.success === false &&
    typeof result.error === 'string' && result.error.indexOf('Unknown action') === 0;
}

function fetchAllData(dateStr) {
  return apiGet('getAll', { date: dateStr }).then(function(result) {
    if (!isUnknownAction(result)) {
      if (!result.success) throw new Error(result.error || '取得に失敗しました');
      return result.data;
    }
    console.warn('getAll未対応のGASです。旧方式で取得します（Code.gsの再デプロイを推奨）');
    return Promise.all([
      apiGet('getProducts'),
      apiGet('getCategories'),
      apiGet('getSchedules', { startDate: dateStr, endDate: dateStr }),
      apiGet('getCategoryOrders', { date: dateStr })
    ]).then(function(r) {
      return {
        products: r[0].success ? r[0].data : undefined,
        categories: r[1].success ? r[1].data : undefined,
        schedules: r[2].success ? r[2].data : undefined,
        categoryOrders: r[3].success ? r[3].data : undefined
      };
    });
  });
}

function fetchDayData(dateStr) {
  return apiGet('getDay', { date: dateStr }).then(function(result) {
    if (!isUnknownAction(result)) {
      if (!result.success) throw new Error(result.error || '取得に失敗しました');
      return result.data;
    }
    return Promise.all([
      apiGet('getSchedules', { startDate: dateStr, endDate: dateStr }),
      apiGet('getCategoryOrders', { date: dateStr })
    ]).then(function(r) {
      return {
        schedules: r[0].success ? r[0].data : undefined,
        categoryOrders: r[1].success ? r[1].data : undefined
      };
    });
  });
}

// 保存レスポンスに最新データが入っていればそれを使い、無ければ読み直す。
// 保存中に日付を移動していた場合は、別の日のデータで今の画面を上書きしない。
function ensureDay(result, dateStr) {
  if (!isCurrentDate(dateStr)) return Promise.resolve(result);
  if (result.day) { applyDay(result.day); return Promise.resolve(result); }
  if (result.recovered) return Promise.resolve(result); // verifyで既に反映済み
  return fetchDayData(dateStr).then(function(data) {
    applyDay(data);
    return result;
  });
}

// ========================================
// 楽観的更新
// ========================================
// GASの往復は5秒前後かかる。待たせずに先に画面へ反映し、裏で確定させる。
// 確定するまで pendingEdits に持っておき、
//   ・サーバー応答で schedules を差し替えたあとに上から重ね直す（他の保存中の値が消えないように）
//   ・失敗したら元の値へ戻す
var pendingEdits = {};      // key -> { date, productId, quantity }（quantity 0 は削除）
var pendingCatOrders = {};  // key -> { date, categoryId, orderNum }（0 は削除）
var syncingCount = 0;

function isCurrentDate(dateStr) {
  return dateStr === formatDate(currentDate);
}

function editKey(dateStr, id) {
  return dateStr + '|' + String(id);
}

function beginSync() {
  syncingCount++;
  document.getElementById('syncBadge').classList.add('show');
}

function endSync() {
  syncingCount = Math.max(0, syncingCount - 1);
  if (syncingCount === 0) {
    document.getElementById('syncBadge').classList.remove('show');
  }
}

function getQty(dateStr, productId) {
  var s = schedules.find(function(x) {
    return x.date === dateStr && String(x.productId) === String(productId);
  });
  return s ? Number(s.quantity) : 0;
}

// ローカルの schedules を書き換える（qty 0 は削除）
function applyLocalSchedule(dateStr, productId, qty) {
  var i = -1;
  for (var n = 0; n < schedules.length; n++) {
    if (schedules[n].date === dateStr && String(schedules[n].productId) === String(productId)) { i = n; break; }
  }
  if (qty > 0) {
    if (i >= 0) schedules[i].quantity = qty;
    else schedules.push({ date: dateStr, productId: productId, quantity: qty, note: '', updatedAt: '' });
  } else if (i >= 0) {
    schedules.splice(i, 1);
  }
}

// ローカルの categoryOrders を書き換える（num 0 は削除）
function applyLocalCatOrder(dateStr, catId, num) {
  var i = -1;
  for (var n = 0; n < categoryOrders.length; n++) {
    if (categoryOrders[n].date === dateStr && String(categoryOrders[n].categoryId) === String(catId)) { i = n; break; }
  }
  if (num > 0) {
    if (i >= 0) categoryOrders[i].orderNum = num;
    else categoryOrders.push({ date: dateStr, categoryId: catId, orderNum: num });
  } else if (i >= 0) {
    categoryOrders.splice(i, 1);
  }
}

// サーバー応答を反映したあと、まだ確定していない編集を上から重ね直す
function reapplyPending() {
  Object.keys(pendingEdits).forEach(function(k) {
    var e = pendingEdits[k];
    applyLocalSchedule(e.date, e.productId, e.quantity);
  });
  Object.keys(pendingCatOrders).forEach(function(k) {
    var e = pendingCatOrders[k];
    applyLocalCatOrder(e.date, e.categoryId, e.orderNum);
  });
}

function ensureMasters(result, dateStr) {
  if (result.masters) { applyAll(result.masters); return Promise.resolve(result); }
  if (result.recovered) return Promise.resolve(result);
  return fetchAllData(dateStr).then(function(data) {
    applyAll(data);
    return result;
  });
}

function loadSchedules() {
  showLoading();
  fetchDayData(formatDate(currentDate)).then(function(data) {
    applyDay(data);
    reapplyPending();   // 読み込み中に保存した分を消さない

  }).catch(function(err) {
    hideLoading();
    showToast('スケジュールの読み込みに失敗しました\n' + err.message, 'error');
  });
}

function applyAll(data) {
  if (!data) return;
  if (data.products) products = data.products;
  if (data.categories) categories = data.categories;
  applyDay(data);
}

function applyDay(data) {
  if (!data) return;
  if (data.schedules) schedules = data.schedules;
  if (data.categoryOrders) categoryOrders = data.categoryOrders;
}

// ========================================
// スケジュール表示
// ========================================
function renderSchedule() {
  var container = document.getElementById('scheduleContainer');
  var dateStr = formatDate(currentDate);

  // カテゴリを表示順でソート
  var sortedCategories = categories.slice().sort(function(a, b) { return (a.order || 0) - (b.order || 0); });

  var totalKg = 0;
  var html = '';

  sortedCategories.forEach(function(cat) {
    var catProducts = products
      .filter(function(p) { return String(p.categoryId) === String(cat.id); })
      .sort(function(a, b) { return (a.order || 0) - (b.order || 0); });

    if (catProducts.length === 0) return;

    var catKg = 0;
    var rowsHtml = '';

    catProducts.forEach(function(prod) {
      var schedule = schedules.find(function(s) {
        return s.date === dateStr && String(s.productId) === String(prod.id);
      });
      var qty = schedule ? schedule.quantity : 0;
      var kg = 0;
      if (qty > 0 && !prod.noCalc) {
        kg = ((prod.contentG + 3) * qty * prod.coefficient) / 1000;
        catKg += kg;
      }

      rowsHtml += '<div class="product-row" onclick="openQtyModal(\'' + prod.id + '\')">';
      rowsHtml += '  <div class="product-name">' + escapeHtml(prod.name) + '</div>';
      rowsHtml += '  <div class="product-qty ' + (qty > 0 ? '' : 'empty') + (pendingEdits[editKey(dateStr, prod.id)] ? ' pending' : '') + '">' + (qty > 0 ? qty + '個' : '-') + '</div>';
      if (!prod.noCalc) {
        rowsHtml += '  <div class="product-kg">' + (qty > 0 ? kg.toFixed(1) + 'kg' : '') + '</div>';
      } else {
        rowsHtml += '  <div class="product-kg"></div>';
      }
      rowsHtml += '</div>';
    });

    totalKg += catKg;

    var catOrderNum = getCatOrder(dateStr, cat.id);
    var catOrderPending = pendingCatOrders[editKey(dateStr, cat.id)] ? ' pending' : '';
    var orderLabel = catOrderNum
      ? '<span class="category-order-num' + catOrderPending + '">' + catOrderNum + '</span>'
      : '';

    html += '<div class="category-section">';
    html += '  <div class="category-header" onclick="openCatOrderModal(\'' + cat.id + '\')">';
    html += '    <span>' + orderLabel + '【' + escapeHtml(cat.name) + '】</span>';
    html += '    <span class="category-kg">' + catKg.toFixed(1) + 'kg</span>';
    html += '  </div>';
    html += rowsHtml;
    html += '</div>';
  });

  // 未分類の商品
  var uncategorized = products.filter(function(p) {
    return !categories.some(function(c) { return String(c.id) === String(p.categoryId); });
  }).sort(function(a, b) { return (a.order || 0) - (b.order || 0); });

  if (uncategorized.length > 0) {
    var ucKg = 0;
    var ucRows = '';
    uncategorized.forEach(function(prod) {
      var schedule = schedules.find(function(s) {
        return s.date === dateStr && String(s.productId) === String(prod.id);
      });
      var qty = schedule ? schedule.quantity : 0;
      var kg = 0;
      if (qty > 0 && !prod.noCalc) {
        kg = ((prod.contentG + 3) * qty * prod.coefficient) / 1000;
        ucKg += kg;
      }
      ucRows += '<div class="product-row" onclick="openQtyModal(\'' + prod.id + '\')">';
      ucRows += '  <div class="product-name">' + escapeHtml(prod.name) + '</div>';
      ucRows += '  <div class="product-qty ' + (qty > 0 ? '' : 'empty') + (pendingEdits[editKey(dateStr, prod.id)] ? ' pending' : '') + '">' + (qty > 0 ? qty + '個' : '-') + '</div>';
      if (!prod.noCalc) {
        ucRows += '  <div class="product-kg">' + (qty > 0 ? kg.toFixed(1) + 'kg' : '') + '</div>';
      } else {
        ucRows += '  <div class="product-kg"></div>';
      }
      ucRows += '</div>';
    });
    totalKg += ucKg;
    html += '<div class="category-section"><div class="category-header"><span>【未分類】</span><span class="category-kg">' + ucKg.toFixed(1) + 'kg</span></div>' + ucRows + '</div>';
  }

  // 合計バー
  html = '<div class="total-bar">合計 ' + totalKg.toFixed(1) + 'kg</div>' + html;

  container.innerHTML = html;
}

// ========================================
// カテゴリ作業順序（スプレッドシート）
// ========================================
function getCatOrder(dateStr, catId) {
  var order = categoryOrders.find(function(o) {
    return String(o.date) === String(dateStr) && String(o.categoryId) === String(catId);
  });
  return order ? order.orderNum : '';
}

function openCatOrderModal(catId) {
  editingCatOrderId = catId;
  var cat = categories.find(function(c) { return String(c.id) === String(catId); });
  if (!cat) return;

  var dateStr = formatDate(currentDate);
  var current = getCatOrder(dateStr, catId);

  document.getElementById('catOrderModalTitle').textContent = '【' + cat.name + '】';
  document.getElementById('catOrderInput').value = current || '';
  document.getElementById('catOrderModal').classList.add('active');
  setTimeout(function() { document.getElementById('catOrderInput').focus(); }, 300);
}

function closeCatOrderModal() {
  document.getElementById('catOrderModal').classList.remove('active');
  editingCatOrderId = null;
}

function saveCatOrder() {
  var num = parseInt(document.getElementById('catOrderInput').value) || 0;
  var catId = editingCatOrderId;
  closeCatOrderModal();
  writeCatOrder(formatDate(currentDate), catId, num);
}

function clearCatOrder() {
  var catId = editingCatOrderId;
  closeCatOrderModal();
  writeCatOrder(formatDate(currentDate), catId, 0);
}

// num > 0 で保存、0 で削除
function writeCatOrder(dateStr, catId, num) {
  var key = editKey(dateStr, catId);
  var prevNum = getCatOrder(dateStr, catId) || 0;

  pendingCatOrders[key] = { date: dateStr, categoryId: catId, orderNum: num };
  applyLocalCatOrder(dateStr, catId, num);
  if (isCurrentDate(dateStr)) renderSchedule();
  beginSync();

  var payload = num > 0
    ? { action: 'saveCategoryOrder', date: dateStr, categoryId: catId, orderNum: num }
    : { action: 'deleteCategoryOrder', date: dateStr, categoryId: catId };

  var verify = function() {
    return fetchDayData(dateStr).then(function(data) {
      if (isCurrentDate(dateStr)) applyDay(data);
      var hit = (data.categoryOrders || []).find(function(o) {
        return String(o.categoryId) === String(catId);
      });
      return num > 0 ? !!(hit && Number(hit.orderNum) === num) : !hit;
    });
  };

  apiWrite(payload, verify).then(function(result) {
    return ensureDay(result, dateStr);
  }).then(function(result) {
    delete pendingCatOrders[key];
    reapplyPending();
    renderSchedule();
    if (result.recovered) showToast(RECOVERED_MSG, 'warn');
  }).catch(function(err) {
    delete pendingCatOrders[key];
    applyLocalCatOrder(dateStr, catId, prevNum);
    reapplyPending();
    renderSchedule();
    showToast((num > 0 ? '保存' : '削除') + 'に失敗しました\n' + err.message +
      '\n表示を元に戻しました', 'error');
  }).then(endSync, endSync);
}

function updateCalc() {
  var prod = products.find(function(p) { return String(p.id) === String(editingProductId); });
  if (!prod) return;

  var qty = parseInt(document.getElementById('qtyInput').value) || 0;
  var calcEl = document.getElementById('qtyCalc');

  if (prod.noCalc) {
    calcEl.textContent = '（原料計算なし）';
  } else if (qty > 0) {
    var kg = ((prod.contentG + 3) * qty * prod.coefficient) / 1000;
    calcEl.innerHTML = '原料 <strong>' + kg.toFixed(1) + 'kg</strong>';
  } else {
    calcEl.textContent = '';
  }
}

function saveQty() {
  var qty = parseInt(document.getElementById('qtyInput').value) || 0;
  var productId = editingProductId;

  // showLoading は使わない（楽観的更新で即座に反映するため）
  closeQtyModal();
  writeSchedule(formatDate(currentDate), productId, qty);
}

function deleteQty() {
  var productId = editingProductId;
  closeQtyModal();
  writeSchedule(formatDate(currentDate), productId, 0);
}

// qty > 0 で保存、0 で削除
function writeSchedule(dateStr, productId, qty) {
  var key = editKey(dateStr, productId);
  var prevQty = getQty(dateStr, productId);   // 失敗したときに戻す値

  // 1) 往復を待たずに画面へ反映する
  pendingEdits[key] = { date: dateStr, productId: productId, quantity: qty };
  applyLocalSchedule(dateStr, productId, qty);
  if (isCurrentDate(dateStr)) renderSchedule();
  beginSync();

  var payload = qty > 0
    ? { action: 'saveSchedule', date: dateStr, productId: productId, quantity: qty }
    : { action: 'deleteSchedule', date: dateStr, productId: productId };

  var verify = function() {
    return fetchDayData(dateStr).then(function(data) {
      if (isCurrentDate(dateStr)) applyDay(data);
      var hit = (data.schedules || []).find(function(s) {
        return String(s.productId) === String(productId);
      });
      return qty > 0 ? !!(hit && Number(hit.quantity) === qty) : !hit;
    });
  };

  apiWrite(payload, verify).then(function(result) {
    return ensureDay(result, dateStr);
  }).then(function(result) {
    // 2) 確定。保留を外して、他に保存中の編集を重ね直す
    delete pendingEdits[key];
    reapplyPending();
    renderSchedule();
    if (result.recovered) showToast(RECOVERED_MSG, 'warn');
  }).catch(function(err) {
    // 3) 本当に失敗。元の値に戻す
    delete pendingEdits[key];
    applyLocalSchedule(dateStr, productId, prevQty);
    reapplyPending();
    renderSchedule();
    showToast((qty > 0 ? '保存' : '削除') + 'に失敗しました\n' + err.message +
      '\n表示を元に戻しました', 'error');
  }).then(endSync, endSync);
}

function renderSettings() {
  // カテゴリ一覧
  var catList = document.getElementById('categoryList');
  var sortedCats = categories.slice().sort(function(a, b) { return (a.order || 0) - (b.order || 0); });
  catList.innerHTML = sortedCats.map(function(cat) {

  }).join('');

  // 商品一覧
  var prodList = document.getElementById('productList');
  var sortedProds = products.slice().sort(function(a, b) {
    var catA = categories.find(function(c) { return String(c.id) === String(a.categoryId); });
    var catB = categories.find(function(c) { return String(c.id) === String(b.categoryId); });
    var orderA = catA ? (catA.order || 0) : 999;
    var orderB = catB ? (catB.order || 0) : 999;

    return (a.order || 0) - (b.order || 0);

      '<span class="settings-item-name">' + escapeHtml(prod.name) + '</span>' +
      '<span class="settings-item-detail">' + escapeHtml(catName) + ' / ' + prod.contentG + 'g / ×' + prod.coefficient + '</span></div>';

function saveCategory() {
  var name = document.getElementById('catName').value.trim();
  if (!name) { showToast('カテゴリ名を入力してください', 'warn'); return; }

  var id = editingCategoryId;
  var order = parseInt(document.getElementById('catOrder').value) || 0;
  showLoading();
  closeCategoryModal();

  var payload = { action: 'saveCategory', name: name, order: order };
  if (id) payload.id = id;

  var verify = function() {
    return fetchAllData(formatDate(currentDate)).then(function(data) {
      applyAll(data);
      return (data.categories || []).some(function(c) {
        // 更新はIDで、新規は名前で反映を確認する
        return id ? (String(c.id) === String(id) && c.name === name)
                  : c.name === name;
      });
    });
  };

  writeMaster(payload, verify, '保存');
}

function deleteCategory() {
  if (!confirm('このカテゴリを削除しますか？')) return;
  var id = editingCategoryId;
  showLoading();
  closeCategoryModal();

  var verify = function() {
    return fetchAllData(formatDate(currentDate)).then(function(data) {
      applyAll(data);
      return !(data.categories || []).some(function(c) { return String(c.id) === String(id); });
    });
  };

  writeMaster({ action: 'deleteCategory', id: id }, verify, '削除');
}

function openProductModal(id) {

  select.innerHTML = sortedCats.map(function(c) {

  if (id) {
    var prod = products.find(function(p) { return String(p.id) === String(id); });
    if (!prod) return;
    document.getElementById('productModalTitle').textContent = '商品編集';
    document.getElementById('prodName').value = prod.name;
    document.getElementById('prodCategory').value = prod.categoryId;
    document.getElementById('prodContentG').value = prod.contentG;
    document.getElementById('prodCoeff').value = prod.coefficient;
    document.getElementById('prodOrder').value = prod.order || 0;
    document.getElementById('prodNoCalc').checked = prod.noCalc;
    document.getElementById('btnProdDelete').style.display = '';
  } else {
    document.getElementById('productModalTitle').textContent = '商品追加';
    document.getElementById('prodName').value = '';
    document.getElementById('prodContentG').value = 0;
    document.getElementById('prodCoeff').value = 0.68;
    document.getElementById('prodOrder').value = 0;
    document.getElementById('prodNoCalc').checked = false;
    document.getElementById('btnProdDelete').style.display = 'none';
  }
  document.getElementById('productModal').classList.add('active');
}

function closeProductModal() {
  document.getElementById('productModal').classList.remove('active');
  editingProdId = null;
}

function saveProduct() {
  var name = document.getElementById('prodName').value.trim();
  if (!name) { showToast('商品名を入力してください', 'warn'); return; }

  // モーダルを閉じる前にすべての値を退避
  var id = editingProdId;
  var categoryId = document.getElementById('prodCategory').value;
  var contentG = parseFloat(document.getElementById('prodContentG').value) || 0;
  var coefficient = parseFloat(document.getElementById('prodCoeff').value) || 0.68;
  var order = parseInt(document.getElementById('prodOrder').value) || 0;
  var noCalc = document.getElementById('prodNoCalc').checked;

  showLoading();
  closeProductModal();

  var postData = {
    action: 'saveProduct',
    name: name,
    categoryId: categoryId,
    contentG: contentG,
    coefficient: coefficient,
    order: order,
    noCalc: noCalc
  };
  if (id) { postData.id = id; }
  console.log('saveProduct送信:', JSON.stringify(postData));

  var verify = function() {
    return fetchAllData(formatDate(currentDate)).then(function(data) {
      applyAll(data);
      return (data.products || []).some(function(p) {
        // 更新はIDで、新規は名前で反映を確認する
        return id ? (String(p.id) === String(id) && p.name === name)
                  : p.name === name;
      });
    });
  };

  writeMaster(postData, verify, '保存');
}

function deleteProduct() {
  if (!confirm('この商品を削除しますか？')) return;
  var id = editingProdId;
  showLoading();
  closeProductModal();

  var verify = function() {
    return fetchAllData(formatDate(currentDate)).then(function(data) {
      applyAll(data);
      return !(data.products || []).some(function(p) { return String(p.id) === String(id); });
    });
  };

  writeMaster({ action: 'deleteProduct', id: id }, verify, '削除');
}

// 商品・カテゴリマスタの書き込み共通処理
function writeMaster(payload, verify, label) {
  apiWrite(payload, verify).then(function(result) {
    return ensureMasters(result, formatDate(currentDate));
  }).then(function(result) {
    renderSettings();
    renderSchedule();
    hideLoading();
    if (result.recovered) showToast(RECOVERED_MSG, 'warn');
  }).catch(function(err) {
    hideLoading();
    renderSettings();
    showToast(label + 'に失敗しました\n' + err.message, 'error');
  });
}

// ========================================
// LINE共有
// ========================================
function copyForLine() {
  var dateStr = formatDate(currentDate);
  var label = document.getElementById('dateLabel').textContent;

  var sortedCategories = categories.slice().sort(function(a, b) { return (a.order || 0) - (b.order || 0); });

  var lines = [];
  lines.push('真田  ' + label);

  var totalKg = 0;

  sortedCategories.forEach(function(cat) {
    var catProducts = products
      .filter(function(p) { return String(p.categoryId) === String(cat.id); })
      .sort(function(a, b) { return (a.order || 0) - (b.order || 0); });

    var catKg = 0;
    var catLines = [];

    catProducts.forEach(function(prod) {
      var schedule = schedules.find(function(s) {
        return s.date === dateStr && String(s.productId) === String(prod.id);
      });
      var qty = schedule ? schedule.quantity : 0;
      if (qty <= 0) return;

      var kg = 0;
      if (!prod.noCalc) {
        kg = ((prod.contentG + 3) * qty * prod.coefficient) / 1000;
        catKg += kg;
      }
      catLines.push('  ' + prod.name + '　× ' + qty + '個');
    });

    if (catLines.length > 0) {
      totalKg += catKg;
      lines.push('');
      var catOrd = getCatOrder(dateStr, cat.id);
      var ordPrefix = catOrd ? catOrd + ' ' : '';
      lines.push(ordPrefix + '【' + cat.name + '】' + catKg.toFixed(1) + 'k');
      catLines.forEach(function(l) { lines.push(l); });
    }
  });

  // 先頭行に合計を追加
  lines[0] += '  合計' + totalKg.toFixed(1) + 'k';

  var text = lines.join('\n');

  navigator.clipboard.writeText(text).then(function() {
    showToast('クリップボードにコピーしました');
  }).catch(function() {
    // フォールバック
    var ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('クリップボードにコピーしました');
  });
}

// ========================================
// ユーティリティ
// ========================================
function escapeHtml(str) {
  var div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// モーダル外側タップで閉じる
document.getElementById('qtyModal').addEventListener('click', function(e) {
  if (e.target === this) closeQtyModal();
});
document.getElementById('categoryModal').addEventListener('click', function(e) {
  if (e.target === this) closeCategoryModal();
});
document.getElementById('productModal').addEventListener('click', function(e) {
  if (e.target === this) closeProductModal();
});
document.getElementById('catOrderModal').addEventListener('click', function(e) {
  if (e.target === this) closeCatOrderModal();
});
